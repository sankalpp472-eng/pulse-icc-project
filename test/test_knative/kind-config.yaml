# Local 2-node cluster for Knative: functions get scheduled onto the worker.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: pulse-kn
nodes:
  - role: control-plane
    extraPortMappings:
      # Kourier (Knative ingress) NodePort -> http://127.0.0.1:8081 on the laptop
      - containerPort: 31080
        hostPort: 8081
        listenAddress: "127.0.0.1"
  - role: worker
