# `terraform plan` for the long-lived AWS resources on every pull request that changes infra/terraform/, so reviewers
# see what a merge would change. Read-only role (OIDC): CI never applies; a person runs `terraform apply`.
# Needs the repository variables AWS_PLAN_ROLE_ARN and TF_STATE_BUCKET (DEV.md, section 6); without them the
# job is skipped.
name: terraform
on:
  pull_request:
    paths: [infra/terraform/**]

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    # skipped (not failed) until the AWS side is set up: DEV.md, section 6
    if: ${{ vars.AWS_PLAN_ROLE_ARN != '' && vars.TF_STATE_BUCKET != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-south-1
      - name: plan the registry root (models, ECR, CI roles)
        run: |
          terraform -chdir=infra/terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform -chdir=infra/terraform plan -input=false -lock=false -no-color | tee plan.txt
      - name: plan summary
        if: always()
        run: |
          [ -f plan.txt ] || exit 0          # no plan when an earlier step failed: its error is above
          { echo '### terraform plan (infra/terraform/)'; echo '```'; tail -n 60 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
