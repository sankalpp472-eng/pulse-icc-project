# Continuous delivery: a push to main that changes the runner image's code builds the image, pushes it to ECR
# (OIDC role, no stored keys) and writes its tag into the GitOps manifests (infra/cloud/kustomization.yaml).
# Argo CD (infra/gitops/) then rolls the new image out to the cluster. Manual runs: Actions -> image -> Run.
# Needs the repository variable AWS_IMAGE_ROLE_ARN (terraform output ci_role_arns, after -var github_repo=...).
name: image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [pulse/**, models/**, data/traces/**, infra/cloud/Dockerfile, infra/cloud/requirements.txt,
            infra/cloud/build_image.sh, infra/cloud/cloud_entry.sh]

permissions:
  id-token: write        # the OIDC token for AWS
  contents: write        # commit the new image tag

concurrency: image

jobs:
  build-push-deploy:
    if: ${{ vars.AWS_IMAGE_ROLE_ARN != '' }}      # skipped until the AWS side is set up (DEV.md, section 6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_IMAGE_ROLE_ARN }}
          aws-region: ap-south-1
      - name: tau-bench conversations the image carries (MIT, sierra-research/tau-bench)
        run: python -m pulse.setup.download_data
      - name: build and push (infra/cloud/build_image.sh)
        run: bash infra/cloud/build_image.sh
      - name: deploy by git (GitOps)
        run: |
          IMAGE=$(cat infra/cloud/.image-ecr)
          sed -i "s|^\(\s*newTag:\).*|\1 ${IMAGE##*:}|" infra/cloud/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: pulse-runner ${IMAGE##*:}" && git push || echo "image tag unchanged"
