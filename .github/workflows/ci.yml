# Checks on every pull request and push to main: the package installs and every module compiles, the Terraform
# roots are formatted and valid, and the GitOps manifests build. Needs no AWS access.
name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -e .
      - run: python -m compileall -q pulse
      - run: python -c "import pulse.predictor.service"   # loads lightgbm + markov (models/action_model.pkl)

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: fmt and validate (no backend, no AWS)
        run: |
          terraform fmt -check -recursive infra/terraform
          for d in infra/terraform infra/terraform/eks infra/terraform/bootstrap; do
            terraform -chdir=$d init -backend=false -input=false >/dev/null
            terraform -chdir=$d validate
          done

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the GitOps kustomizations build
        run: |
          kubectl kustomize infra/cloud > /dev/null
          kubectl kustomize infra/monitoring > /dev/null
