# Shared airline database for the 14 MCP tools (reservations + users; flights are read-only).
# deploy.sh seeds it, the runners reset it between episodes. The append-only file on an emptyDir keeps the data
# across a container restart (crash, OOM kill); a new pod (scale to 0 and back, eviction, node move) starts empty,
# and the first tool call reseeds it from the data in the tools' image (mcp_server.py, ensure_seeded).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: default
  labels:
    pulse/role: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        pulse/role: database
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["--save", "", "--appendonly", "yes", "--dir", "/data"]
          volumeMounts:
            - name: data
              mountPath: /data
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: default
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
