# The monitoring manifests that are not the Helm chart: scrape configs (monitors.yaml) and the dashboards as
# ConfigMaps Grafana's sidecar loads. Applied by install.sh (kubectl apply -k) and by Argo CD (infra/gitops/).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - monitors.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
configMapGenerator:
  - name: pulse-dashboard-overview
    files: [dashboards/overview.json]
  - name: pulse-dashboard-predictor
    files: [dashboards/predictor.json]
  - name: pulse-dashboard-cluster
    files: [dashboards/cluster.json]
