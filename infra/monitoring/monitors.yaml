# What Prometheus scrapes besides the chart's own targets (kube-state-metrics, node-exporter, kubelet/cAdvisor).
# Pulse's pods are matched by label and by NAMED container port (infra/cloud/*.yaml, run_cloud.sh);
# every series gets a `component` label = the pod's app label.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata: {name: pulse-predictors, namespace: monitoring}
spec:
  namespaceSelector: {matchNames: [default]}
  selector: {matchLabels: {app: pulse-predictor}}
  podMetricsEndpoints:
    - port: http                      # pulse-predictor's own port (pulse/predictor/service.py mounts /metrics/)
      path: /metrics/
      relabelings: [{sourceLabels: [__meta_kubernetes_pod_label_app], targetLabel: component}]
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata: {name: pulse-controller, namespace: monitoring}
spec:
  namespaceSelector: {matchNames: [default]}
  selector: {matchLabels: {app: pulse-controller}}
  podMetricsEndpoints:
    - port: metrics
      relabelings: [{sourceLabels: [__meta_kubernetes_pod_label_app], targetLabel: component}]
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata: {name: pulse-runners, namespace: monitoring}
spec:
  namespaceSelector: {matchNames: [default]}
  selector: {matchLabels: {app: pulse-run}}
  podMetricsEndpoints:
    - port: metrics                   # run_cloud.sh's run pods
      relabelings: [{sourceLabels: [__meta_kubernetes_pod_label_app], targetLabel: component}]
---
# Knative: the queue-proxy next to every tool pod, and the activator / autoscaler. Scraped for exploration in
# Grafana; check their metric names on the cluster before building panels on them (they changed across releases).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata: {name: knative-queue-proxy, namespace: monitoring}
spec:
  namespaceSelector: {matchNames: [default]}
  selector:
    matchExpressions: [{key: serving.knative.dev/revision, operator: Exists}]
  podMetricsEndpoints:
    - port: http-usermetric
    - port: http-autometric
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata: {name: knative-serving, namespace: monitoring}
spec:
  namespaceSelector: {matchNames: [knative-serving]}
  selector:
    matchExpressions: [{key: app, operator: In, values: [activator, autoscaler]}]
  podMetricsEndpoints:
    - port: metrics
