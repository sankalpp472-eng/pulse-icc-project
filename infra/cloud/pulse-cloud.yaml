# Pulse's own components in the cluster, next to the Knative tools (applied by cloud_up.sh, which fills
# in __IMAGE__ and __THETA__). The Groq keys come from the Secret pulse-llm-keys (cloud_up.sh makes it
# from .env). Runs are separate pods started by run_cloud.sh with the same image and account.
#
#   pulse-predictor   pulse/predictor/service.py: hints in, PrewarmRequests out                  :8000
#                     PREDICTOR = lightgbm | markov | speculator | pulse_v3 picks the model; switch it with
#                     kubectl set env deploy/pulse-predictor PREDICTOR=markov   (run_cloud.sh does this per run)
#   pulse-embed       llama.cpp server with nomic-embed-text: sentence embeddings for pulse_v3   :8091
#   pulse-controller  watches PrewarmRequests, pings tools at http://{svc}.default.svc.cluster.local/mcp
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pulse
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pulse
rules:
  - apiGroups: ["pulse.iisc.ac.in"]                 # predictors write, the controller reconciles
    resources: ["prewarmrequests", "prewarmrequests/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]                                 # pod watcher, cold/warm labels, controller's pod count
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]                                 # Redis reset between runs (kubectl exec deploy/redis)
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["serving.knative.dev"]              # tool settings for run_config.json, the controller's TTL
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]                                 # Knative autoscaler config + version, node count
    resources: ["configmaps", "namespaces", "nodes", "services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pulse
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: pulse}
subjects: [{kind: ServiceAccount, name: pulse, namespace: default}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-predictor
  namespace: default
  labels: {app: pulse-predictor, pulse/role: system}
spec:
  replicas: 1
  selector: {matchLabels: {app: pulse-predictor}}
  template:
    metadata:
      labels: {app: pulse-predictor, pulse/role: system}
    spec:
      serviceAccountName: pulse
      containers:
        - name: predictor
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "uvicorn", "pulse.predictor.service:app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - {name: PREDICTOR, value: lightgbm}
            - {name: CRD_MODE, value: k8s}
            - {name: THETA, value: "__THETA__"}
            - {name: PULSE_EMBED_BASE, value: "http://pulse-embed:8091/v1"}   # pulse_v3's embeddings (pulse-embed below)
            - {name: PULSE_DATA_DIR, value: /tmp/pulse-data}           # pulse_v3's embedding cache, and models
            - {name: PULSE_REGISTRY_CACHE, value: /tmp/registry}       # from S3: writable (the image is read-only)
          envFrom:
            - secretRef: {name: pulse-llm-keys, optional: true}       # speculator: Groq keys or SPEC_BASE_URL/SPEC_API_KEY
            - configMapRef: {name: pulse-config, optional: true}      # PULSE_MODEL_URI / ACTION_MODEL_URI (+ _VERSION pins): S3 via IRSA
          ports: [{name: http, containerPort: 8000}]          # named: Prometheus finds /metrics/ by it (infra/monitoring)
          readinessProbe: {httpGet: {path: /healthz, port: 8000}, periodSeconds: 5}
          resources: {requests: {cpu: 100m, memory: 384Mi}, limits: {memory: 1536Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: pulse-predictor, namespace: default}
spec:
  selector: {app: pulse-predictor}
  ports: [{port: 8000, targetPort: 8000}]
---
# The embedding server pulse_v3 reads (PULSE_EMBED_BASE): the same llama.cpp server + nomic-embed-text-v1.5 as the
# training Job's sidecar (infra/training/train-job.yaml), so serving and training embed text the same way.
# The model (~140 MB GGUF) is downloaded from Hugging Face when the pod starts, into an emptyDir (kept across
# container restarts). It prefers the client node, away from the tools whose cold starts are measured.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-embed
  namespace: default
  labels: {app: pulse-embed, pulse/role: system}
spec:
  replicas: 1
  selector: {matchLabels: {app: pulse-embed}}
  template:
    metadata:
      labels: {app: pulse-embed, pulse/role: system}
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference: {matchExpressions: [{key: pulse/role, operator: In, values: [client]}]}
      tolerations: [{key: pulse/role, operator: Equal, value: client, effect: NoSchedule}]
      containers:
        - name: embed
          image: ghcr.io/ggml-org/llama.cpp:server
          args: ["-hf", "nomic-ai/nomic-embed-text-v1.5-GGUF:Q8_0", "--alias", "nomic-embed", "--embedding",
                 "--pooling", "mean", "-c", "8192", "--parallel", "4", "-b", "2048", "-ub", "2048",
                 "--host", "0.0.0.0", "--port", "8091"]
          env: [{name: LLAMA_CACHE, value: /models}]
          ports: [{name: http, containerPort: 8091}]
          volumeMounts: [{name: models, mountPath: /models}]
          startupProbe: {httpGet: {path: /health, port: 8091}, periodSeconds: 5, failureThreshold: 120}
          readinessProbe: {httpGet: {path: /health, port: 8091}, periodSeconds: 10}
          resources: {requests: {cpu: 500m, memory: 512Mi}, limits: {memory: 1Gi}}
      volumes: [{name: models, emptyDir: {sizeLimit: 1Gi}}]
---
apiVersion: v1
kind: Service
metadata: {name: pulse-embed, namespace: default}
spec:
  selector: {app: pulse-embed}
  ports: [{port: 8091, targetPort: 8091}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-controller
  namespace: default
  labels: {app: pulse-controller, pulse/role: system}
spec:
  replicas: 1
  selector: {matchLabels: {app: pulse-controller}}
  template:
    metadata:
      labels: {app: pulse-controller, pulse/role: system}
    spec:
      serviceAccountName: pulse
      containers:
        - name: controller
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "pulse.controller.prewarm_controller"]
          env:
            - {name: CONTROLLER_LOG, value: /tmp/controller.jsonl}   # also printed: kubectl logs deploy/pulse-controller
            - {name: CONTROLLER_METRICS_PORT, value: "9102"}
          ports: [{name: metrics, containerPort: 9102}]       # Prometheus (infra/monitoring/monitors.yaml)
          resources: {requests: {cpu: 100m, memory: 192Mi}, limits: {memory: 512Mi}}
