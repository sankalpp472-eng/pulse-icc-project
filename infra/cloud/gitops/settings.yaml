# What cloud_up.sh fills in by sed, for the GitOps build (kustomization.yaml): θ and the predictor, and the IAM
# role of Pulse's service account (IRSA, infra/terraform/eks/irsa.tf: read models).
apiVersion: apps/v1
kind: Deployment
metadata: {name: pulse-predictor}
spec:
  template:
    spec:
      containers:
        - name: predictor
          env: [{name: THETA, value: "0.3"}, {name: PREDICTOR, value: lightgbm}]   # the predictor Argo CD deploys
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pulse
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::234612058031:role/pulse-eks-pulse
