# kube-prometheus-stack for Pulse (deploy/monitoring/install.sh). Kept small: no Alertmanager, no default
# alert rules, short retention. Cluster-specific settings: values-kind.yaml / values-eks.yaml.
fullnameOverride: pulse-mon

alertmanager:
  enabled: false
defaultRules:
  create: false
# control-plane components are not reachable on EKS (managed) or kind (localhost-bound)
kubeEtcd: {enabled: false}
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeProxy: {enabled: false}

prometheus:
  prometheusSpec:
    scrapeInterval: 15s
    retention: 2d
    # pick up every ServiceMonitor / PodMonitor (deploy/monitoring/monitors.yaml), not only the chart's own
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {memory: 1536Mi}

prometheusOperator:
  resources:
    requests: {cpu: 50m, memory: 96Mi}

kube-state-metrics:
  # pod labels Pulse's queries join on: which Knative service a pod belongs to, and the app of Pulse's own pods
  metricLabelsAllowlist:
    - pods=[serving.knative.dev/service,app]

grafana:
  fullnameOverride: pulse-mon-grafana
  # The UI shows Grafana under its own /grafana/ path (ui/server.py proxies it, stripping the prefix), so Grafana
  # serves at / but builds its links under /grafana/. Read-only anonymous access and embedding for the UI's
  # Monitoring tab; the admin password is in the Secret pulse-mon-grafana (install.sh prints how to read it).
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/grafana/"
      serve_from_sub_path: false
    auth.anonymous:
      enabled: true
      org_role: Viewer
    security:
      allow_embedding: true
    live:
      max_connections: 0          # no websockets through the UI's proxy
  sidecar:
    datasources:
      enabled: true
      uid: prometheus             # dashboards and the UI's queries name the data source by this uid
    dashboards:
      enabled: true
      label: grafana_dashboard    # ConfigMaps made by install.sh from deploy/monitoring/dashboards/*.json
      labelValue: "1"
      searchNamespace: monitoring
  resources:
    requests: {cpu: 50m, memory: 128Mi}
