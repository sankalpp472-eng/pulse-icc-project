# Retraining pulse-v3 as a Kubernetes Job (deploy/training/run_training.sh fills in __IMAGE__, __URI__, __VERSION__,
# __PROMOTE__, __NOTES__). It runs pulse_pred/train.py on the client node, away from the tools: pull the training
# data from the S3 registry, train, evaluate against the current model, publish (latest only if it is better).
#
# AWS access: the service account pulse-trainer is bound to an IAM role with the pulse-model-publisher policy
# (IRSA; run_training.sh says how to create it). No AWS keys in the cluster.
# Embeddings: a native sidecar (llama.cpp server + nomic-embed-text, downloaded from Hugging Face at start) for the
# texts the cached embeddings in S3 do not cover yet; it stops with the Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: pulse-train-__VERSION__
  namespace: default
  labels: {app: pulse-train, pulse/role: training}
spec:
  backoffLimit: 0                      # a failed training is looked at, not retried blindly
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: pulse-train, pulse/role: training}
    spec:
      serviceAccountName: pulse-trainer
      restartPolicy: Never
      nodeSelector: {pulse/role: client}
      tolerations: [{key: pulse/role, operator: Equal, value: client, effect: NoSchedule}]
      initContainers:
        - name: embed                  # native sidecar (restartPolicy Always): runs next to the trainer, ends with it
          image: ghcr.io/ggml-org/llama.cpp:server
          restartPolicy: Always
          args: ["-hf", "nomic-ai/nomic-embed-text-v1.5-GGUF:Q8_0", "--alias", "nomic-embed", "--embedding",
                 "--pooling", "mean", "-c", "8192", "--parallel", "4", "-b", "2048", "-ub", "2048",
                 "--host", "127.0.0.1", "--port", "8091"]
          startupProbe: {httpGet: {path: /health, port: 8091}, periodSeconds: 5, failureThreshold: 60}
          resources: {requests: {cpu: 500m, memory: 512Mi}, limits: {memory: 1Gi}}
      containers:
        - name: train
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["python", "pulse_pred/train.py", "--uri", "__URI__", "--version", "__VERSION__",
                    "--promote", "__PROMOTE__", "--notes", "__NOTES__"]
          env:
            - {name: PULSE_EMBED_BASE, value: "http://127.0.0.1:8091/v1"}
            - {name: PULSE_DATA_DIR, value: /tmp/pulse-data}
            - {name: PULSE_MODELS_DIR, value: /tmp/pulse-data}
            - {name: PYTHONUNBUFFERED, value: "1"}
          resources: {requests: {cpu: "1", memory: 2Gi}, limits: {memory: 6Gi}}
