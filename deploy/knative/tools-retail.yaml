apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: retail-calculate
  namespace: default
  labels:
    pulse/role: mcp-tool-retail
    pulse/tool: calculate
spec:
  template:
    metadata:
      labels:            # on the template so every POD carries them (service labels are not copied to pods)
        pulse/role: mcp-tool-retail
        pulse/tool: calculate
      annotations:
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/window: "60s"
        autoscaling.knative.dev/max-scale: "10"
        autoscaling.knative.dev/target-utilization-percentage: "100"
    spec:
      containerConcurrency: 1   # requests one pod serves at once (0 = no limit)
      containers:
        - image: docker.io/sankalps2003/pulse-mcp-tools:0.2
          ports:
            - containerPort: 8080
          env:
            - name: TOOLS
              value: calculate
            - name: DOMAIN
              value: retail
            - name: REDIS_URL
              value: redis://redis.default.svc.cluster.local:6379/1
          # /healthz answers only once the MCP server is up (data loaded, routes mounted).
          # No periodSeconds -> Knative probes aggressively while the pod starts.
          readinessProbe:
            httpGet:
              path: /healthz
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
---
