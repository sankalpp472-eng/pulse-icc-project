apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: book-reservation
  namespace: default
  labels:
    pulse/role: mcp-tool
    pulse/tool: book_reservation
spec:
  template:
    metadata:
      labels:            # on the template so every POD carries them (service labels are not copied to pods)
        pulse/role: mcp-tool
        pulse/tool: book_reservation
      annotations:
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/window: "60s"
    spec:
      containers:
        - image: docker.io/sankalps2003/pulse-mcp-tools:0.2
          ports:
            - containerPort: 8080
          env:
            - name: TOOLS
              value: book_reservation
          # /healthz answers only once the MCP server is up (data loaded, routes mounted).
          # No periodSeconds -> Knative probes aggressively while the pod starts.
          readinessProbe:
            httpGet:
              path: /healthz
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
---
