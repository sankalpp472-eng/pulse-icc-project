# Argo CD applications: what the cluster should run, read from this Git repository (install.sh fills in __REPO__,
# __REVISION__ and __CHART_VERSION__). A merged commit is a deploy; `git revert` is a rollback.
#
#   pulse-system   EKS_deployment/cloud (kustomize): predictor, speculator, controller, UI, RBAC, pulse-config,
#                  the trainer's service account. CI writes the image tag there after every build.
#   pulse-crds     deploy/prewarm: the PrewarmRequest CRD
#   monitoring     kube-prometheus-stack (Helm) with deploy/monitoring/values*.yaml
#   monitoring-config  deploy/monitoring (kustomize): scrape configs and dashboards
#
# Not managed here: the Knative tools (deploy/knative), because experiments switch their min-scale at runtime
# (C0 <-> C1). Self-heal is off for pulse-system for the same reason (the UI may restart / reconfigure things);
# Argo CD shows such drift as OutOfSync until the next sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: pulse-crds, namespace: argocd}
spec:
  project: default
  source:
    repoURL: __REPO__
    targetRevision: __REVISION__
    path: deploy/prewarm
    directory: {include: prewarmrequest-crd.yaml}
  destination: {server: https://kubernetes.default.svc}
  syncPolicy:
    automated: {prune: false, selfHeal: true}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: pulse-system, namespace: argocd}
spec:
  project: default
  source:
    repoURL: __REPO__
    targetRevision: __REVISION__
    path: EKS_deployment/cloud
  destination: {server: https://kubernetes.default.svc, namespace: default}
  syncPolicy:
    automated: {prune: false, selfHeal: false}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: monitoring, namespace: argocd}
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: __CHART_VERSION__
      helm:
        releaseName: pulse-mon
        valueFiles: [$values/deploy/monitoring/values.yaml, $values/deploy/monitoring/values-eks.yaml]
    - repoURL: __REPO__
      targetRevision: __REVISION__
      ref: values
  destination: {server: https://kubernetes.default.svc, namespace: monitoring}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]     # the chart's CRDs are too big for client-side apply
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: monitoring-config, namespace: argocd}
spec:
  project: default
  source:
    repoURL: __REPO__
    targetRevision: __REVISION__
    path: deploy/monitoring
  destination: {server: https://kubernetes.default.svc, namespace: monitoring}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
