# Settings Pulse's pods read (envFrom, optional): the model registry and the pinned pulse-v3 version.
# Changing the model in production = a pull request changing PULSE_MODEL_VERSION (the UI's Models tab writes it:
# "Pin in Git"); empty = the registry's latest.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pulse-config
data:
  PULSE_MODEL_URI: s3://pulse-models-ACCOUNT_ID/pulse-v3
  PULSE_MODEL_VERSION: ""
