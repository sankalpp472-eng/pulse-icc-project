# The retraining Job's service account (deploy/training/train-job.yaml): may publish models through IRSA
# (terraform/eks/irsa.tf). With GitOps this replaces `eksctl create iamserviceaccount`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pulse-trainer
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/pulse-eks-pulse-trainer
